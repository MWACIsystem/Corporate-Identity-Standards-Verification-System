<script>

document.getElementById("adminList").innerHTML = "⏳ กำลังโหลดชิ้นงาน...";
console.log("ADMIN START");


let adminData = [];
let adminPage = 0;
let adminSearchTerm = "";
let adminToken = "";

const ADMIN_PER_PAGE = 10;

function gasCall(functionName, ...args) {
  return new Promise((resolve, reject) => {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);

    runner[functionName](...args);
  });
}

function formatThaiDate(value) {
  if (!value) return "-";

  const date = value.seconds
    ? new Date(value.seconds * 1000)
    : new Date(value);

  return isNaN(date.getTime())
    ? "-"
    : date.toLocaleDateString("th-TH");
}

window.handleAdminSearch = function(value){
  adminSearchTerm = value.trim().toLowerCase();
  adminPage = 0;
  renderAdmin(0);
};

// ================= ATTACHMENT HELPERS =================

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderAttachmentList(attachments) {

  if (!Array.isArray(attachments) || attachments.length === 0) {
    return `<div class="text-muted">ยังไม่มีไฟล์แนบ</div>`;
  }

  return `
    <ol style="text-align:left;padding-left:22px;">
      ${attachments.map(a => `
        <li style="margin-bottom:8px;">
          <a href="${escapeHtml(a.url)}"
             target="_blank"
             rel="noopener noreferrer">
            📎 ${escapeHtml(a.name)}
          </a>
          ${
            a.shared === false
              ? `<div style="font-size:12px;color:#dc3545;">
                   ยังไม่สามารถแชร์ไฟล์ให้ผู้ส่งได้
                 </div>`
              : ""
          }
        </li>
      `).join("")}
    </ol>
  `;
}

// แปลงไฟล์เป็น Base64 ก่อนส่งให้ Apps Script
function fileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {
      const result = String(reader.result);
      resolve(result.split(",")[1] || "");
    };

    reader.onerror = () => {
      reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
    };

    reader.readAsDataURL(file);
  });
}

// เรียก Google Apps Script
function gasUploadAdminAttachment(base64, name, type, email, token) {

  return new Promise((resolve, reject) => {

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .uploadAdminAttachment(base64, name, type, email, token);

  });
}

function gasUpdateAttachmentsByLink(workUrl, attachments, token) {

  return new Promise((resolve, reject) => {

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .updateAttachmentsByLink(workUrl, attachments, token);

  });
}

function gasUpdateStatusByLink(workUrl, status, comment, by, attachments, token) {

  return new Promise((resolve, reject) => {

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .updateStatusByLink(workUrl, status, comment, by, attachments, token);

  });
}

function gasSendEmailUpdate(email, name, status, comment, link, attachments, token) {

  return new Promise((resolve, reject) => {

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .sendEmailUpdate(email, name, status, comment, link, attachments, token);

  });
}

function gasLoadAdminData(token) {
  return gasCall("getAdminFromFirestore", token);
}

function gasAddAttachment(id, attachment, token) {
  return gasCall("addAttachmentFirestore", id, attachment, token);
}

function gasUpdateSubmission(id, status, comment, by, token) {
  return gasCall(
    "updateSubmissionFirestore",
    id,
    status,
    comment,
    by,
    token
  );
}

// ================= MANAGE ATTACHMENTS =================

window.manageAttachments = async function(id) {

  const record = adminData.find(d => d.id === id);

  if (!record) {
    Swal.fire("Error", "ไม่พบข้อมูลชิ้นงาน", "error");
    return;
  }

  const attachments = record.attachments || [];

  const result = await Swal.fire({

    title: "📎 ไฟล์ประกอบการพิจารณา",

    html: `
      <div style="
        background:#f5f9fc;
        padding:15px;
        border-radius:10px;
        margin-bottom:15px;
        text-align:left;
      ">
        <strong style="color:#065BAA;">ไฟล์ที่แนบไว้แล้ว</strong>

        <div style="margin-top:10px;">
          ${renderAttachmentList(attachments)}
        </div>
      </div>

      <div style="text-align:left;">
        <label style="font-weight:600;margin-bottom:8px;">
          เลือกไฟล์ที่ต้องการแนบเพิ่มเติม
        </label>

        <input
          type="file"
          id="adminAttachmentInput"
          class="form-control"
          accept="image/*,application/pdf"
          multiple
        >

        <small style="color:#777;">
          รองรับ JPG, PNG, GIF, WebP, HEIC และ PDF
          ขนาดไม่เกิน 10 MB ต่อไฟล์
        </small>
      </div>
    `,

    width: 600,
    showCancelButton: true,
    confirmButtonText: "📤 อัปโหลดไฟล์",
    cancelButtonText: "ปิด",

    preConfirm: () => {

      const input = document.getElementById("adminAttachmentInput");
      const files = Array.from(input.files || []);

      if (files.length === 0) {
        Swal.showValidationMessage("กรุณาเลือกไฟล์ที่ต้องการอัปโหลด");
        return false;
      }

      return files;
    }

  });

  if (!result.isConfirmed) return;

  await uploadAdminFiles(id, result.value);
};

// ================= UPLOAD ADMIN FILES =================

async function uploadAdminFiles(id, files) {

  const record = adminData.find(d => d.id === id);

  if (!record) return;

  if (!adminToken) {
    Swal.fire("Error", "กรุณาเข้าสู่ระบบ Admin ใหม่", "error");
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/webp",
    "image/heic",
    "image/heif",
    "application/pdf"
  ];

  if (files.length > 5) {
    Swal.fire("แจ้งเตือน", "อัปโหลดได้ไม่เกิน 5 ไฟล์ต่อครั้ง", "warning");
    return;
  }

  for (const file of files) {

    if (!allowedTypes.includes(file.type)) {
      Swal.fire("แจ้งเตือน", `ไม่รองรับไฟล์ ${file.name}`, "warning");
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      Swal.fire("แจ้งเตือน", `ไฟล์ ${file.name} มีขนาดเกิน 10 MB`, "warning");
      return;
    }
  }

  let uploadedCount = 0;
  const warnings = [];

  Swal.fire({
    title: "กำลังอัปโหลดไฟล์...",
    text: "กรุณาอย่าปิดหน้าต่างนี้",
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {

    // อัปโหลดทีละไฟล์
    for (const file of files) {

      const base64 = await fileToBase64(file);

      const result = await gasUploadAdminAttachment(
        base64,
        file.name,
        file.type,
        record.email || "",
        adminToken
      );

      if (!result || result.status !== "success" || !result.attachment) {
        throw new Error("ไม่สามารถอัปโหลดไฟล์ " + file.name);
      }

// แปลงข้อมูลที่ได้จาก Google Apps Script
// ให้เป็น Plain Object ก่อนส่งเข้า Firestore
const attachment = {
  id: String(result.attachment.id || ""),
  name: String(result.attachment.name || ""),
  url: String(result.attachment.url || ""),
  mimeType: String(result.attachment.mimeType || ""),
  size: Number(result.attachment.size || 0),
  uploadedAt: String(result.attachment.uploadedAt || ""),
  shared: Boolean(result.attachment.shared),
  shareMessage: String(result.attachment.shareMessage || "")
};

// บันทึกข้อมูลไฟล์ผ่าน Apps Script
const saveResult = await gasAddAttachment(
  id,
  attachment,
  adminToken
);

if (!saveResult || saveResult.status !== "success") {
  throw new Error("ไม่สามารถบันทึกข้อมูลไฟล์ลง Firestore ได้");
}

record.attachments = saveResult.attachments || [];

uploadedCount++;

if (!attachment.shared) {
  warnings.push(attachment.name);
}

// ปิด for loop หลังอัปโหลดไฟล์ครบทุกไฟล์
}


// ใช้รายการไฟล์แนบล่าสุดที่ Apps Script ส่งกลับมา
const allAttachments = record.attachments || [];

    // Sync ลิงก์ไฟล์ลง Google Sheet
    if (record.workUrl) {

      try {

        const sheetResult = await gasUpdateAttachmentsByLink(
          record.workUrl,
          allAttachments,
          adminToken
        );

        if (!sheetResult || sheetResult.status !== "success") {
          warnings.push("ไม่สามารถอัปเดต Google Sheet ได้");
        }

      } catch (err) {
        warnings.push("ไม่สามารถอัปเดต Google Sheet ได้");
      }
    }

    // โหลดรายการใหม่
    adminData = [];
    await renderAdmin(adminPage);

    let message = `อัปโหลดสำเร็จ ${uploadedCount} ไฟล์`;

    if (warnings.length > 0) {
      message += "\n\nคำเตือน: " + warnings.join(", ");
    }

    Swal.fire({
      title: "ดำเนินการเรียบร้อย",
      text: message,
      icon: warnings.length > 0 ? "warning" : "success"
    });

  } catch (err) {

    console.error(err);

    if (uploadedCount > 0) {

      adminData = [];
      await renderAdmin(adminPage);

      Swal.fire(
        "อัปโหลดได้บางส่วน",
        `อัปโหลดสำเร็จ ${uploadedCount} ไฟล์\n${err.message}`,
        "warning"
      );

    } else {

      Swal.fire("อัปโหลดไม่สำเร็จ", err.message, "error");

    }
  }
}

/* LOAD ADMIN DATA */
async function renderAdmin(page = 0) {
  try {
    // โหลดข้อมูลจาก Firestore ผ่าน Apps Script
    if (adminData.length === 0) {
      if (!adminToken) {
        throw new Error("กรุณาเข้าสู่ระบบ Admin");
      }

      const result = await gasLoadAdminData(adminToken);
      adminData = Array.isArray(result) ? result : [];
    }

    if (adminData.length === 0) {
      document.getElementById("adminList").innerHTML = "ไม่มีข้อมูล";
      return;
    }

    adminPage = page;

    // ค้นหาข้อมูล
    const filteredAdminData = adminData.filter(d => {
      const createdDate = formatThaiDate(d.createdAt);
      const updatedDate = formatThaiDate(d.updatedAt);

      const text = `
        ${d.firstName || ""}
        ${d.lastName || ""}
        ${createdDate}
        ${d.department || ""}
        ${d.phone || ""}
        ${d.email || ""}
        ${d.mediaType || ""}
        ${d.workUrl || ""}
        ${d.description || ""}
        ${d.round || ""}
        ${d.status || ""}
        ${updatedDate}
        ${d.comment || ""}
        ${d.by || ""}
      `.toLowerCase();

      return text.includes(adminSearchTerm);
    });

    if (filteredAdminData.length === 0) {
      document.getElementById("adminList").innerHTML =
        adminSearchTerm ? "ไม่พบข้อมูลที่ค้นหา" : "ไม่มีข้อมูล";
      return;
    }

    const start = page * ADMIN_PER_PAGE;
    const end = start + ADMIN_PER_PAGE;
    const pageData = filteredAdminData.slice(start, end);

    let html = `
      <div>
      <table class="table table-hover align-middle table-bordered">
      <tr>
        <th>ลำดับ</th>
        <th>ชื่อ</th>
        <th>นามสกุล</th>
        <th>วันที่ส่ง</th>
        <th>หน่วยงาน</th>
        <th>เบอร์</th>
        <th>อีเมล</th>
        <th>ประเภทสื่อ</th>
        <th>ชิ้นงาน</th>
        <th>รายละเอียด</th>
        <th>รอบ</th>
        <th>สถานะ</th>
        <th>วันที่ให้ความเห็น</th>
        <th>ความคิดเห็น</th>
        <th>ผู้ให้ความเห็น</th>
        <th>บันทึก / ไฟล์แนบ</th>
      </tr>
    `;

    let i = start + 1;

    pageData.forEach(d => {
      const id = String(d.id || "");
      const createdDate = formatThaiDate(d.createdAt);
      const updatedDate = formatThaiDate(d.updatedAt);
      const attachments = Array.isArray(d.attachments)
        ? d.attachments
        : [];

      const workUrl = String(d.workUrl || "");
      const safeWorkUrl = /^https?:\/\//i.test(workUrl)
        ? escapeHtml(workUrl)
        : "";

      html += `
        <tr
          data-workurl="${escapeHtml(workUrl)}"
          data-email="${escapeHtml(d.email || "")}"
          data-name="${escapeHtml((d.firstName || "") + " " + (d.lastName || ""))}"
        >
          <td>${i++}</td>
          <td>${escapeHtml(d.firstName)}</td>
          <td>${escapeHtml(d.lastName)}</td>
          <td>${createdDate}</td>
          <td>${escapeHtml(d.department)}</td>
          <td>${escapeHtml(d.phone)}</td>
          <td>${escapeHtml(d.email)}</td>
          <td>
            <div class="media-scroll-admin">
              ${escapeHtml(d.mediaType)}
            </div>
          </td>
          <td>
            ${
              safeWorkUrl
                ? `<a href="${safeWorkUrl}" target="_blank" rel="noopener noreferrer">ชิ้นงาน</a>`
                : "-"
            }
          </td>
          <td>
            <div class="detail-scroll-admin">
              ${escapeHtml(d.description)}
            </div>
          </td>
          <td>${escapeHtml(d.round)}</td>

          <td>
            <select id="status_${escapeHtml(id)}" class="form-select form-select-sm">
              <option value="รอพิจารณา" ${d.status === "รอพิจารณา" ? "selected" : ""}>รอพิจารณา</option>
              <option value="ปรับแก้" ${d.status === "ปรับแก้" ? "selected" : ""}>ปรับแก้</option>
              <option value="เห็นชอบ" ${d.status === "เห็นชอบ" ? "selected" : ""}>เห็นชอบ</option>
            </select>
          </td>

          <td>${updatedDate}</td>

          <td>
            <textarea
              id="comment_${escapeHtml(id)}"
              class="form-control"
              rows="3"
            >${escapeHtml(d.comment)}</textarea>
          </td>

          <td>
            <input
              id="by_${escapeHtml(id)}"
              class="form-control"
              value="${escapeHtml(d.by)}"
            >
          </td>

          <td>
            <div class="d-flex flex-column gap-1 align-items-center">
              <button
                class="btn btn-outline-primary btn-sm"
                onclick="manageAttachments('${escapeHtml(id)}')"
                title="แนบไฟล์ประกอบการพิจารณา"
              >
                📎 ${attachments.length}
              </button>

              <button
                class="btn btn-success btn-sm"
                onclick="saveAdmin('${escapeHtml(id)}', this)"
              >
                💾
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    html += `</table>`;
    html += `<div style="text-align:center;margin-top:15px;">`;

    if (page > 0) {
      html += `
        <button class="btn btn-secondary btn-sm"
          onclick="renderAdmin(${page - 1})">
          ⬅️ ก่อนหน้า
        </button>
      `;
    }

    if (end < filteredAdminData.length) {
      html += `
        <button class="btn btn-primary btn-sm"
          onclick="renderAdmin(${page + 1})">
          ถัดไป ➡️
        </button>
      `;
    }

    html += `</div></div>`;

    document.getElementById("adminList").innerHTML = html;

  } catch (err) {
    console.error(err);

    document.getElementById("adminList").innerHTML =
      "<div style='color:red'>โหลดข้อมูลไม่สำเร็จ: " +
      escapeHtml(err.message) +
      "</div>";
  }
}

// ================= SAVE ADMIN =================

window.saveAdmin = async function(id, btnEl) {
  try {
    const status = document.getElementById(`status_${id}`).value;
    const comment = document.getElementById(`comment_${id}`).value;
    const by = document.getElementById(`by_${id}`).value;

    const tr = btnEl.closest("tr");
    const workUrl = tr?.dataset?.workurl || "";
    const email = tr?.dataset?.email || "";
    const name = tr?.dataset?.name || "";

    const record = adminData.find(d => d.id === id);
    const attachments = record?.attachments || [];

    if (!adminToken) {
      throw new Error("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่");
    }

    Swal.fire({
      title: "กำลังบันทึกข้อมูล...",
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    // 1. อัปเดตข้อมูลใน Firestore ผ่าน Apps Script
    const updateResult = await gasUpdateSubmission(
  id,
  status,
  comment,
  by,
  adminToken
);

if (!updateResult || updateResult.status !== "success") {
  throw new Error("ไม่สามารถบันทึกข้อมูลลง Firestore ได้");
}

    record.status = status;
    record.comment = comment;
    record.by = by;
    record.updatedAt = {
      seconds: Math.floor(Date.now() / 1000)
    };

    // 2. อัปเดต Google Sheet
    if (workUrl) {
      const sheetResult = await gasUpdateStatusByLink(
        workUrl, status, comment, by, attachments, adminToken
      );

      if (!sheetResult || sheetResult.status !== "success") {
        throw new Error(
          "บันทึก Firestore แล้ว แต่ไม่สามารถอัปเดต Google Sheet ได้"
        );
      }
    }

    // 3. ส่งอีเมลแจ้งผล
    if (email) {
      const mailResult = await gasSendEmailUpdate(
        email, name, status, comment, workUrl, attachments, adminToken
      );

      if (!mailResult || mailResult.status !== "sent") {
        throw new Error(
          "บันทึกข้อมูลแล้ว แต่ไม่สามารถส่งอีเมลได้"
        );
      }
    }

    Swal.fire(
      "สำเร็จ",
      "บันทึกข้อมูลและส่งผลการตรวจสอบเรียบร้อยแล้ว",
      "success"
    );

    adminData = [];
    await renderAdmin(adminPage);

  } catch (err) {
    console.error(err);
    Swal.fire("ERROR", err.message, "error");
  }
};


/* ================= EMAIL ACCESS ================= */

async function askEmailAccess() {

  const { value: formValues } = await Swal.fire({

    title: "เข้าสู่ระบบ Admin",

    html: `
      <input
        id="swal-admin-email"
        class="swal2-input"
        placeholder="Email"
        type="email"
      >

      <input
        id="swal-admin-password"
        type="password"
        class="swal2-input"
        placeholder="Password"
      >
    `,

    focusConfirm: false,
    confirmButtonText: "เข้าสู่ระบบ",
    allowOutsideClick: false,

    preConfirm: () => {

      const email = document
        .getElementById("swal-admin-email")
        .value.trim();

      const password = document
        .getElementById("swal-admin-password")
        .value;

      if (!email || !password) {
        Swal.showValidationMessage("กรุณากรอก Email และ Password ให้ครบ");
        return false;
      }

      return { email, password };
    }

  });

  if (!formValues) return;

  google.script.run

    .withSuccessHandler(res => {

      console.log("ACCESS", res);

      if (res && res.access && res.token) {

        adminToken = res.token;

        renderAdmin();

      } else {

        adminToken = "";

        Swal.fire({
          title: "เข้าสู่ระบบไม่สำเร็จ",
          text: "Email หรือ Password ไม่ถูกต้อง",
          icon: "error",
          confirmButtonText: "ลองอีกครั้ง"
        }).then(() => {
          askEmailAccess();
        });

      }

    })

    .withFailureHandler(err => {

      console.error("LOGIN ERROR", err);

      Swal.fire({
        title: "เกิดข้อผิดพลาด",
        text: err.message || "ไม่สามารถเข้าสู่ระบบได้",
        icon: "error",
        confirmButtonText: "ลองอีกครั้ง"
      }).then(() => {
        askEmailAccess();
      });

    })

    .checkEmailManual(formValues.email, formValues.password);

}

// เรียก Popup Login ทันทีเมื่อ JavaScript ทำงานถึงจุดนี้
if (typeof Swal === "undefined") {
  document.getElementById("adminList").innerHTML =
    "<div style='color:red'>ไม่สามารถโหลดระบบ Popup ได้ กรุณาตรวจสอบ SweetAlert2</div>";
} else {
  askEmailAccess();
}
